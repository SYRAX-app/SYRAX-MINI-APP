  "rocket-queen": "#e879f9", dice: GREEN, coinflip: "#FF8A00",
};
const SIGNAL_SECONDS = 20;
const FLIGHT_SECONDS = 3; // lucky-jet, aviator, rocket-queen
const ADMIN_IDS = [8501518219]; // faqat shu Telegram ID admin panel ochadi

function isAdminUser() {
  try {
    const u = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
    if (!u || !u.id) return false;
    return ADMIN_IDS.indexOf(Number(u.id)) !== -1;
  } catch (e) { return false; }
}
function getAdminSeq(gameId) {
  try {
    const raw = localStorage.getItem("syrax_admin_seq");
    const all = raw ? JSON.parse(raw) : {};
    return Array.isArray(all[gameId]) ? all[gameId].filter(Boolean) : [];
  } catch (e) { return []; }
}
function nextAdminValue(gameId) {
  const seq = getAdminSeq(gameId);
  if (!seq.length) return null;
  let idxMap = {};
  try { idxMap = JSON.parse(localStorage.getItem("syrax_admin_idx") || "{}"); } catch (e) {}
  const i = idxMap[gameId] || 0;
  const val = seq[i % seq.length];
  idxMap[gameId] = i + 1;
  try { localStorage.setItem("syrax_admin_idx", JSON.stringify(idxMap)); } catch (e) {}
  return val;
}
function generateRngResult(gameId) {
  const rand = () => Math.random();
  switch (gameId) {
    case "aviator":
    case "lucky-jet":
    case "rocket-queen": {
      const adminVal = nextAdminValue(gameId);
      if (adminVal != null && adminVal !== "") {
        const s = String(adminVal).trim();
        const v = s.endsWith("x") || s.endsWith("X") ? s : (s + "x");
        return { type: "multiplier", value: v };
      }
      const r = Math.max(rand(), 0.0001);
      return { type: "multiplier", value: `${Math.max(1, (0.99 / r)).toFixed(2)}x` };
    }
    case "dice":
      return { type: "dice", value: Math.floor(rand() * 6) + 1 };
    case "coinflip":
      return { type: "coinflip", value: rand() < 0.5 ? "HEAD" : "TAIL" };
    default:
      return { type: "number", value: Math.floor(rand() * 100) + 1 };
  }
}

function SignalScreen({ item, onBack, t, stored, saveSignal, clearSignal, accessOk, onNeedAccount }) {
  const accent = ACCENTS[item.id] || GREEN;
  const isMines = item.id === "mines" || item.id === "mines-classic";
  const isCoinflip = item.id === "coinflip";
  const isDice = item.id === "dice";
  const isFlight = item.id === "aviator" || item.id === "lucky-jet" || item.id === "rocket-queen";
  // Flight o'yinlarda 3s timer yo'q — signal darhol, "Yangi signal" bilan qayta
  const hasTimer = !isMines && !isFlight;
  const timerSeconds = SIGNAL_SECONDS;
  const canSignal = accessOk !== false; // only block when explicitly false


  // Restore remaining time from store if still valid
  const restoreFromStore = () => {
    if (!stored || !stored.savedAt) return null;
    const elapsed = Math.floor((Date.now() - stored.savedAt) / 1000);
    const remain = (stored.secondsLeft || (item.id === "aviator" || item.id === "lucky-jet" || item.id === "rocket-queen" ? FLIGHT_SECONDS : SIGNAL_SECONDS)) - elapsed;
    if (remain <= 0) return null;
    return { ...stored, secondsLeft: remain };
  };
  const restored = restoreFromStore();

  const [started, setStarted] = useState(!!restored);
  const [bombs, setBombs] = useState(3);
  const [seconds, setSeconds] = useState(restored ? restored.secondsLeft : timerSeconds);
  const [result, setResult] = useState(restored ? restored.result : null);
  const [cells, setCells] = useState(restored && restored.cells ? restored.cells : Array(25).fill(null));
  const [spinning, setSpinning] = useState(false);
  const [coinSide, setCoinSide] = useState(restored && restored.coinSide ? restored.coinSide : null);
  const [loading, setLoading] = useState(false);
  const [chance, setChance] = useState(restored && restored.chance ? restored.chance : null);
  const [revealed, setRevealed] = useState(restored && restored.cells ? 25 : 0);
  const [entering, setEntering] = useState(
    !restored && (item.id === "aviator" || item.id === "lucky-jet" || item.id === "rocket-queen")
  );
  const [syncing, setSyncing] = useState(false);
  const [syncPhase, setSyncPhase] = useState(0);
  const [syncLine, setSyncLine] = useState(0);
  const [syncBar, setSyncBar] = useState(0);

  useEffect(() => {
    if (!entering) return;
    const ms = (item.id === "lucky-jet" || item.id === "aviator" || item.id === "rocket-queen") ? 2000 : 1600;
    const t = setTimeout(() => setEntering(false), ms);
    return () => clearTimeout(t);
  }, [entering, item.id]);

  // Persist remaining seconds while active
  useEffect(() => {
    if (!started || !hasTimer || !result) return;
    saveSignal(item.id, {
      result,
      secondsLeft: seconds,
      coinSide,
      cells,
      chance,
    });
  }, [seconds, started]);

  // Clear store when timer ends
  useEffect(() => {
    if (started && hasTimer && seconds <= 0 && clearSignal) {
      clearSignal(item.id);
    }
  }, [seconds, started]);

  useEffect(() => {
    if (!started || isMines || seconds <= 0) return;
    const id = setTimeout(() => setSeconds(s => s - 1), 1000);
    return () => clearTimeout(id);
  }, [started, seconds, isMines]);

  const revealMines = () => {
    const idxs = [...Array(25).keys()];
    for (let i = idxs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
    }
    const bombSet = new Set(idxs.slice(0, bombs));
    // Stars: safe cells that look good (about 7-10 stars)
    const starCount = Math.min(25 - bombs, 7 + Math.floor(Math.random() * 4));
    const starSet = new Set(idxs.slice(bombs, bombs + starCount));
    const newCells = Array.from({ length: 25 }, (_, i) => bombSet.has(i) ? "bomb" : starSet.has(i) ? "star" : "empty");
    setCells(newCells);
    // Chance calculation (demo)
    const safe = 25 - bombs;
    const ch = (85 + Math.random() * 12).toFixed(2);
    setChance(ch);
    return newCells;
  };

  const handleGetSignal = () => {
    if (syncing || spinning) return;
    // If timer still running, don't generate new signal
    if (started && hasTimer && seconds > 0) return;

    // Faqat ro'yxat + 50$ depozit qilganlar signal oladi
    if (!canSignal) {
      if (onNeedAccount) onNeedAccount();
      return;
    }

    // Flight: timer yo'q — darhol signal, qayta "Yangi signal"
    if (isFlight) {

      const res = generateRngResult(item.id);
      setResult(res);
      setSeconds(0);
      setStarted(true);
      if (saveSignal) saveSignal(item.id, { result: res, secondsLeft: 0 });
      return;
    }

    // Shared sync overlay for trust/realism
    setSyncing(true);
    setSyncPhase(0);
    setSyncLine(0);
    setSyncBar(0);

    const phases = [
      { phase: 0, bar: 18, lines: 1, delay: 400 },
      { phase: 0, bar: 35, lines: 2, delay: 700 },
      { phase: 1, bar: 52, lines: 3, delay: 1100 },
      { phase: 1, bar: 68, lines: 4, delay: 1500 },
      { phase: 2, bar: 82, lines: 5, delay: 2000 },
      { phase: 2, bar: 94, lines: 6, delay: 2500 },
      { phase: 3, bar: 100, lines: 6, delay: 3000 },

    phases.forEach(({ phase, bar, lines, delay }) => {
      setTimeout(() => {
        setSyncPhase(phase);
        setSyncBar(bar);
        setSyncLine(lines);
      }, delay);
    });

    const finishSync = (fn) => {
      setTimeout(() => {
        fn();
        setSyncing(false);
      }, 3400);
    };

    if (isMines) {
      setStarted(false);
      setCells(Array(25).fill(null));
      setRevealed(0);
      setChance(null);
      finishSync(() => {
        const newCells = revealMines();
        setStarted(true);
        let count = 0;
        const starIndexes = newCells.map((c,i) => c === "star" ? i : -1).filter(i => i >= 0);
        const tick = () => {
          count++;
          setRevealed(count);
          if (count < starIndexes.length) setTimeout(tick, 90);
        };
        setTimeout(tick, 80);
      });
    } else if (isCoinflip) {
      const res = generateRngResult("coinflip");
      setResult(res);
      setCoinSide(null);
      finishSync(() => {
        setSpinning(true);

          setCoinSide(res.value);
          setSpinning(false);
          setSeconds(SIGNAL_SECONDS);
          setStarted(true);
          if (saveSignal) saveSignal(item.id, { result: res, secondsLeft: SIGNAL_SECONDS, coinSide: res.value });

    } else if (isDice) {
      setStarted(false);
      setResult(null);

        const direction = Math.random() < 0.5 ? "low" : "high";

        const roll = Math.random();
        if (roll < 0.85) {
          chanceNum = Math.floor(Math.random() * 41) + 20;
        } else if (roll < 0.97) {
          chanceNum = Math.random() < 0.5
            ? Math.floor(Math.random() * 10) + 10
            : Math.floor(Math.random() * 20) + 61;
        } else {
          chanceNum = Math.floor(Math.random() * 7) + 3;
        }
        if (direction === "low") {
          target = chanceNum;
        } else {
          target = 100 - chanceNum;
        }
        const displayTarget = target;
        const mult = (100 / Math.max(chanceNum, 1)).toFixed(2);
        const diceRes = {
          type: "dice",
          direction,
          target,
          displayTarget,
          mult: mult,
          chance: String(chanceNum),

        setResult(diceRes);
        setSeconds(SIGNAL_SECONDS);
        setStarted(true);
        if (saveSignal) saveSignal(item.id, { result: diceRes, secondsLeft: SIGNAL_SECONDS });
      });

function AdminPanel({ onClose }) {
  const games = [
    { id: "lucky-jet", name: "Lucky Jet" },
    { id: "aviator", name: "Aviator" },
    { id: "rocket-queen", name: "Rocket Queen" },
  ];
  const load = () => {
    try { return JSON.parse(localStorage.getItem("syrax_admin_seq") || "{}"); } catch (e) { return {}; }
  };
  const [seq, setSeq] = useState(load);
  const [draft, setDraft] = useState({});
  const [msg, setMsg] = useState("");

  useEffect(() => {
    const s = load();
    setSeq(s);
    const d = {};
    games.forEach(g => { d[g.id] = (s[g.id] || []).join(", "); });
    setDraft(d);
  }, []);

  const saveGame = (gameId) => {
    const raw = (draft[gameId] || "").split(/[\s,;]+/).map(x => x.trim()).filter(Boolean).slice(0, 10);
    const next = { ...seq, [gameId]: raw };
    setSeq(next);
    localStorage.setItem("syrax_admin_seq", JSON.stringify(next));
    try {
      const idx = JSON.parse(localStorage.getItem("syrax_admin_idx") || "{}");
      idx[gameId] = 0;
      localStorage.setItem("syrax_admin_idx", JSON.stringify(idx));
    } catch (e) {}
    setMsg(gameId + " saqlandi (" + raw.length + " ta)");
    setTimeout(() => setMsg(""), 2000);
  };

  const clearGame = (gameId) => {
    const next = { ...seq, [gameId]: [] };
    setSeq(next);
    setDraft({ ...draft, [gameId]: "" });
    localStorage.setItem("syrax_admin_seq", JSON.stringify(next));
    setMsg(gameId + " tozalandi");
  };

  return (
    <div onClick={onClose} style={{

function App() {
  const [query, setQuery] = useState("");
  const [active, setActive] = useState(null);
  const [lang, setLang] = useState("uz");
  const [langOpen, setLangOpen] = useState(false);
  const [adminOpen, setAdminOpen] = useState(false);
  const [accountOpen, setAccountOpen] = useState(false);
  const [signalStore, setSignalStore] = useState({});
  const [access, setAccess] = useState({ loading: false, ok: true, reason: "", tgId: null });

  const [statusLoading, setStatusLoading] = useState(false);

  const API = "https://syrax-bot.onrender.com/api/access";

  const getTgId = () => {
    try {
      const u = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
      if (u && u.id) return String(u.id);
    } catch (e) {}
    const m = /[?&]tg_id=(\d+)/.exec(window.location.search || "");
    return m ? m[1] : null;
  };

  const checkAccess = (showLoading = true) => {
    const tgId = getTgId();
    if (!tgId) {
      // Mini-app ochiq, lekin signal ishlamaydi
      setAccess({ loading: false, ok: false, reason: "no_id", tgId: null });
      return;
    }
    if (showLoading) setStatusLoading(true);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    fetch(API + "?tg_id=" + tgId + "&_=" + Date.now(), { signal: ctrl.signal })
      .then(r => r.json())
      .then(d => {
        setAccess({ loading: false, ok: !!d.ok, reason: d.reason || "", tgId });
      })
      .catch(() => {
        // Tarmoq xatosida signalni bloklash (xavfsiz tomon)
        setAccess(prev => ({ ...prev, loading: false, ok: false, reason: "network", tgId }));
      })
      .finally(() => {
        clearTimeout(timer);
        setStatusLoading(false);
      });
  };

  useEffect(() => {
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {}
    // Mini-app hammaga ochiq. Signal faqat backend ok=true (reg + 50$ dep) bo'lsa.
    const tgId = getTgId();
    setAccess({ loading: false, ok: false, reason: tgId ? "" : "no_id", tgId });
    if (tgId) checkAccess(false);
  }, []);



  const t = T[lang] || T.uz;
  const isRtl = lang === "ar";

  const currentLang = LANGS.find(l => l.code === lang) || LANGS[0];

    setSignalStore(prev => ({ ...prev, [gameId]: { ...data, savedAt: Date.now() } }));
  };
  const clearSignal = (gameId) => {
    setSignalStore(prev => {
      const next = { ...prev };
      delete next[gameId];
      return next;
    });
  };

  if (active) {
    return (
      <>
        <SignalScreen
          item={active}
          onBack={() => setActive(null)}
          t={t}
          stored={signalStore[active.id] || null}
          saveSignal={saveSignal}
          clearSignal={clearSignal}
          accessOk={!!access.ok}
          onNeedAccount={() => setAccountOpen(true)}
        />
        {accountOpen && (
          <AccountPanel
            onClose={() => setAccountOpen(false)}
            access={access}
            statusLoading={statusLoading}
            onRefresh={() => checkAccess(true)}
            t={t}
          />
        )}
      </>
    );

  return (

    <div dir={isRtl ? "rtl" : "ltr"} style={{ minHeight: "100vh", background: "#000", color: "#fff", position: "relative", overflow: "hidden" }}>

        )}
      </div>

      {adminOpen && isAdminUser() && <AdminPanel onClose={() => setAdminOpen(false)} />}

      {accountOpen && (
        <AccountPanel
          onClose={() => setAccountOpen(false)}
          access={access}
          statusLoading={statusLoading}
          onRefresh={() => checkAccess(true)}
          t={t}
        />
      )}

      {langOpen && (

        <div onClick={() => setLangOpen(false)} style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 70,
          display: "flex", alignItems: "flex-end", justifyContent: "center",
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: "100%", maxWidth: 420, background: CARD_BG,
            borderTop: "1px solid rgba(255,255,255,0.1)", borderRadius: "28px 28px 0 0",
            padding: "12px 20px 32px",

              {LANGS.map(l => (

          </div>

      )}
    </div>
  );
}

</script>
